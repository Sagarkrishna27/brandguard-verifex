# Runs lightweight build and syntax checks for the advertisement improvement workflow.
name: BrandGuard workflow checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ad-improvement-workflow]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/unified_analysis.py
